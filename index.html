<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#4a0e0e">
<title>Survey Kebutuhan Nasabah – Bank Akasia Mas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-950:#2c0808;
    --maroon-900:#4a0e0e;
    --maroon-700:#6e1717;
    --maroon-500:#8f2323;
    --gold-500:#c9a227;
    --gold-300:#e0c568;
    --cream:#faf6ee;
    --cream-dim:#f1e9da;
    --ink:#241b15;
    --ink-soft:#6b5f54;
    --line:#e4d9c6;
    --white:#ffffff;
    --radius:18px;
    --shadow: 0 20px 50px -20px rgba(44,8,8,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #5c1414 0%, #3d0d0d 45%, #2c0808 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  .header{
    width:100%;
    max-width:520px;
    padding:24px 20px 10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .logo-banner{
    width:100%;
    max-width:280px;
    height:auto;
    display:block;
    border-radius:8px;
    box-shadow:0 10px 26px -12px rgba(0,0,0,0.5);
  }
  .header-subtitle{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-300);
    padding-left:2px;
  }

  .wrap{
    width:100%;
    max-width:520px;
    flex:1;
    display:flex;
    flex-direction:column;
    padding:8px 20px 40px;
  }

  .progress-shell{
    margin:14px 0 26px;
  }
  .progress-track{
    height:5px;
    background:rgba(255,255,255,0.16);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-300));
    border-radius:99px;
    transition:width .45s cubic-bezier(.65,0,.35,1);
  }
  .progress-label{
    margin-top:10px;
    font-size:12.5px;
    color:var(--gold-300);
    font-weight:600;
    letter-spacing:0.04em;
  }

  .card{
    background:var(--cream);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:32px 26px 26px;
    position:relative;
    overflow:hidden;
    flex:1;
    display:flex;
    flex-direction:column;
    transition:opacity .32s cubic-bezier(.4,0,.2,1), transform .32s cubic-bezier(.4,0,.2,1);
  }
  .card.card-exit{
    opacity:0;
    transform:translateY(-12px) scale(0.98);
  }
  .card::before{
    content:"";
    position:absolute;
    top:-90px; right:-90px;
    width:220px; height:220px;
    border-radius:50%;
    border:24px solid rgba(201,162,39,0.08);
  }
  .step-num{
    font-family:'Fraunces', serif;
    font-size:13px;
    font-weight:600;
    color:var(--gold-500);
    letter-spacing:0.1em;
    margin-bottom:10px;
  }
  .q-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:23px;
    line-height:1.32;
    color:var(--maroon-950);
    margin-bottom:6px;
    position:relative;
  }
  .q-subtitle{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:20px;
    font-style:italic;
  }
  .q-subtitle.no-italic{ font-style:normal; }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:6px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--white);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
  }
  .option:active{ transform:scale(0.99); }
  .option .mark{
    width:19px; height:19px;
    border:1.5px solid #c9bda8;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
    background:var(--white);
  }
  .option .mark.round{ border-radius:50%; }
  .option .mark.square{ border-radius:5px; }
  .option .mark::after{
    content:"";
    width:9px; height:9px;
    border-radius:50%;
    background:var(--gold-500);
    opacity:0;
    transform:scale(0.5);
    transition:all .15s ease;
  }
  .option .mark.square::after{
    border-radius:2px;
  }
  .option.selected{
    border-color:var(--maroon-700);
    background:#fbf3e6;
  }
  .option.selected .mark{
    border-color:var(--maroon-700);
  }
  .option.selected .mark::after{
    opacity:1; transform:scale(1);
  }

  .hint-max{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:12px;
  }

  .fields{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:4px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--maroon-900);
    margin-bottom:7px;
  }
  .field label .req{
    color:var(--maroon-500);
  }
  .field input{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:14.5px;
    background:var(--white);
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--maroon-700);
  }
  .privacy-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:16px;
    line-height:1.5;
  }

  .nav{
    margin-top:auto;
    padding-top:26px;
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:15px 18px;
    border-radius:12px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:linear-gradient(180deg, var(--maroon-700), var(--maroon-900));
    color:var(--gold-300);
    box-shadow:0 10px 22px -10px rgba(74,14,14,0.6);
  }
  .btn-primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .btn-ghost{
    flex:0 0 auto;
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    padding:15px 18px;
  }

  .footer-note{
    text-align:center;
    color:rgba(250,246,238,0.55);
    font-size:11.5px;
    margin-top:22px;
    letter-spacing:0.02em;
  }

  /* Thank you screen */
  .thanks{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    justify-content:center;
    flex:1;
    padding:20px 6px;
  }
  .thanks .seal-big{
    width:76px; height:76px;
    border-radius:50%;
    border:2px solid var(--gold-500);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    position:relative;
  }
  .thanks .seal-big::after{
    content:"";
    position:absolute; inset:-10px;
    border:1px solid rgba(201,162,39,0.4);
    border-radius:50%;
  }
  .thanks .seal-big svg{ width:32px; height:32px; }
  .thanks h2{
    font-family:'Fraunces', serif;
    font-size:25px;
    font-weight:600;
    color:var(--maroon-950);
    margin-bottom:10px;
  }
  .thanks p{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.6;
    max-width:340px;
  }
  .thanks .brandline{
    margin-top:28px;
    font-size:12.5px;
    color:var(--gold-500);
    font-weight:700;
    letter-spacing:0.04em;
  }

  .error-msg{
    background:#fdeceb;
    border:1px solid #f3b9b3;
    color:#8a2b22;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:10px;
    margin-top:14px;
  }

  .hidden{ display:none !important; }

  /* ============ ANIMASI ============ */
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px) scale(0.985); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .card.animate-in{
    animation: cardIn .42s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes optionIn{
    from{ opacity:0; transform:translateX(-8px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .option{
    animation: optionIn .38s cubic-bezier(.22,1,.36,1) both;
  }

  .option{
    transition:border-color .18s ease, background .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  .option:hover{
    border-color:var(--gold-500);
    transform:translateY(-1px);
    box-shadow:0 6px 16px -8px rgba(74,14,14,0.25);
  }
  .option.selected{
    animation: optionPop .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes optionPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.02); }
    100%{ transform:scale(1); }
  }
  .option .mark::after{
    transform:scale(0);
  }
  .option.selected .mark::after{
    animation: markPop .28s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes markPop{
    0%{ transform:scale(0); opacity:0; }
    60%{ transform:scale(1.3); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .step-num, .q-title, .q-subtitle{
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
  }
  .q-title{ animation-delay:.03s; }
  .q-subtitle{ animation-delay:.06s; }
  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .nav{
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
    animation-delay:.1s;
  }

  .btn-primary{
    position:relative;
    overflow:hidden;
  }
  .btn-primary::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
    transform:translateX(-100%);
  }
  .btn-primary:not(:disabled):hover::after{
    animation: shine 1.1s ease;
  }
  @keyframes shine{
    to{ transform:translateX(100%); }
  }
  .btn-primary:not(:disabled):hover{
    box-shadow:0 12px 26px -10px rgba(74,14,14,0.75);
    transform:translateY(-1px);
  }
  .btn-ghost:hover{
    border-color:var(--maroon-700);
    color:var(--maroon-700);
  }

  .progress-fill{
    position:relative;
    overflow:hidden;
  }
  .progress-fill::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    animation: progressShimmer 1.6s ease-in-out infinite;
  }
  @keyframes progressShimmer{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(220%); }
  }

  /* Thank you screen animations */
  .thanks{
    animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
  }
  .thanks .seal-big{
    animation: sealBigIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes sealBigIn{
    0%{ opacity:0; transform:scale(0.5) rotate(-15deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  .thanks .seal-big svg path{
    stroke-dasharray:30;
    stroke-dashoffset:30;
    animation: drawCheck .5s ease .35s forwards;
  }
  @keyframes drawCheck{
    to{ stroke-dashoffset:0; }
  }
  .thanks h2{
    animation: fadeSlideUp .45s ease .2s both;
  }
  .thanks p{
    animation: fadeSlideUp .45s ease .3s both;
  }
  .thanks .brandline{
    animation: fadeSlideUp .45s ease .4s both;
  }
  .thanks .btn-restart{
    animation: fadeSlideUp .45s ease .5s both;
    margin-top:26px;
    background:transparent;
    border:1.5px solid var(--maroon-700);
    color:var(--maroon-900);
    padding:14px 26px;
    border-radius:12px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:all .18s ease;
  }
  .thanks .btn-restart:hover{
    background:var(--maroon-900);
    color:var(--gold-300);
    transform:translateY(-1px);
    box-shadow:0 10px 22px -12px rgba(74,14,14,0.6);
  }
  .thanks .btn-restart svg{
    width:15px; height:15px;
    transition:transform .3s ease;
  }
  .thanks .btn-restart:hover svg{
    transform:rotate(180deg);
  }

  .confetti-dot{
    position:absolute;
    border-radius:50%;
    opacity:0;
    animation: confettiFall 1.6s ease-out forwards;
  }
  @keyframes confettiFall{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(70px) scale(0.4); }
  }

  @media (prefers-reduced-motion: reduce){
    .progress-fill, .option, .btn{ transition:none; }
    .card.animate-in, .option, .step-num, .q-title, .q-subtitle, .nav,
    .btn-primary::after, .progress-fill::after, .thanks,
    .thanks .seal-big, .thanks .seal-big svg path, .thanks h2, .thanks p,
    .thanks .brandline, .thanks .btn-restart, .confetti-dot{
      animation:none !important;
    }
  }

  @media (max-width: 400px){
    .card{ padding:26px 20px 20px; }
    .q-title{ font-size:20px; }
  }
</style>
</head>
<body>

<div class="header">
  <img src="assets/logo-bank-akasia-mas.png" alt="Bank Akasia Mas" class="logo-banner">
  <div class="header-subtitle">Survey Kebutuhan Nasabah</div>
</div>

<div class="wrap">

  <div class="progress-shell" id="progressShell">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">Pertanyaan 1 dari 8</div>
  </div>

  <div class="card" id="card">
    <!-- question content injected here -->
  </div>

  <div class="footer-note">Bank Akasia Mas · Data Anda aman bersama kami 🔒</div>
</div>

<script>
/* =========================================================
   KONFIGURASI — ganti URL ini dengan Web App URL Apps Script-mu
   (lihat panduan setup-google-sheets.md)
   ========================================================= */
const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzaIQQVg5q0WIqTlfrtuhSuaZ1WP_El0tPEBhFCm_eoOrFR2cWb-z0RlAKCo3bBOBwU/exec";

/* ============ DATA PERTANYAAN ============ */
const questions = [
  {
    id: "identitas",
    title: "Identitas Anda",
    subtitle: "Nama dan nomor WhatsApp Anda dijaga kerahasiaannya",
    type: "contact",
    required: true
  },
  {
    id: "tahu_bpr",
    title: "Apakah Anda tahu BPR?",
    type: "single",
    options: ["Ya", "Tidak Tahu", "Pernah dengar"]
  },
  {
    id: "kebutuhan_finansial",
    title: "Saat ini, apa kebutuhan finansial Anda yang paling utama?",
    subtitle: "Pilih yang paling sesuai",
    type: "single",
    options: [
      "Menyimpan uang dengan aman",
      "Mengembangkan dana/tabungan",
      "Membutuhkan pinjaman",
      "Membutuhkan dana untuk rumah/usaha",
      "Kebutuhan pendidikan",
      "Kebutuhan konsumtif/pribadi",
      "Masih ingin mengetahui pilihan yang sesuai"
    ]
  },
  {
    id: "produk_dibutuhkan",
    title: "Jika menggunakan layanan bank, produk apa yang paling Anda butuhkan?",
    type: "single",
    options: [
      "Tabungan",
      "Deposito",
      "Kredit/Pinjaman",
      "Kredit untuk usaha",
      "Kredit untuk kebutuhan pribadi",
      "Layanan perbankan digital",
      "Belum tahu / ingin mendapatkan rekomendasi"
    ]
  },
  {
    id: "alasan_pilih_bpr",
    title: "Apa alasan utama Anda memilih BPR?",
    subtitle: "Pilih maksimal 2",
    type: "multi",
    max: 2,
    options: [
      "Keamanan dan kepercayaan",
      "Bunga menarik",
      "Proses cepat dan mudah",
      "Pelayanan yang ramah",
      "Layanan digital yang mudah digunakan",
      "Lokasi dekat dan mudah dijangkau",
      "Bisa memberikan solusi sesuai kebutuhan",
      "Biaya yang terjangkau"
    ]
  },
  {
    id: "kebutuhan_dana",
    title: "Untuk kebutuhan apa biasanya Anda mengelola atau menggunakan dana?",
    type: "single",
    options: [
      "Kebutuhan sehari-hari",
      "Menabung",
      "Investasi/mengembangkan dana",
      "Modal atau pengembangan usaha",
      "Pendidikan",
      "Rumah/kendaraan",
      "Kebutuhan lainnya"
    ]
  },
  {
    id: "prioritas_produk_keuangan",
    title: "Ketika membutuhkan produk keuangan, apa yang paling Anda prioritaskan?",
    subtitle: "“Yang paling penting bagi Anda adalah...”",
    type: "single",
    options: [
      "Pelayanan yang baik",
      "Proses yang cepat",
      "Biaya/bunga yang kompetitif",
      "Keamanan dana",
      "Kemudahan transaksi"
    ]
  },
  {
    id: "minat_info_produk",
    title: "Apakah Anda tertarik mendapatkan informasi mengenai produk Bank Akasia Mas yang sesuai dengan kebutuhan Anda?",
    type: "single",
    options: [
      "Ya, saya tertarik",
      "Mungkin, saya ingin mengetahui terlebih dahulu",
      "Tidak untuk saat ini"
    ]
  },
];

/* ============ STATE ============ */
let current = 0;
const answers = {};
const total = questions.length;

const card = document.getElementById("card");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const progressShell = document.getElementById("progressShell");

function updateProgress(){
  const pct = Math.round(((current) / total) * 100);
  progressFill.style.width = pct + "%";
  progressLabel.textContent = `Pertanyaan ${Math.min(current+1,total)} dari ${total}`;
}

function render(){
  updateProgress();
  const q = questions[current];
  let html = `<div class="step-num">${String(current+1).padStart(2,"0")}</div>`;
  html += `<div class="q-title">${q.title}</div>`;
  if(q.subtitle) html += `<div class="q-subtitle">${q.subtitle}</div>`;

  if(q.type === "single"){
    html += `<div class="options">`;
    q.options.forEach((opt,i)=>{
      const selected = answers[q.id] === opt ? "selected" : "";
      html += `<div class="option ${selected}" data-value="${escapeAttr(opt)}" style="animation-delay:${i*0.045}s">
                 <span class="mark round"></span>${opt}
               </div>`;
    });
    html += `</div>`;
  }

  if(q.type === "multi"){
    html += `<div class="options">`;
    q.options.forEach((opt,i)=>{
      const arr = answers[q.id] || [];
      const selected = arr.includes(opt) ? "selected" : "";
      html += `<div class="option ${selected}" data-value="${escapeAttr(opt)}" style="animation-delay:${i*0.045}s">
                 <span class="mark square"></span>${opt}
               </div>`;
    });
    html += `</div><div class="hint-max">Maksimal ${q.max} pilihan</div>`;
  }

  if(q.type === "contact"){
    const vals = answers[q.id] || {nama:"", wa:""};
    html += `<div class="fields">
      <div class="field">
        <label>Nama ${q.required ? '<span class="req">*</span>' : ''}</label>
        <input type="text" id="inputNama" placeholder="Nama lengkap" value="${escapeAttr(vals.nama)}">
      </div>
      <div class="field">
        <label>Nomor WhatsApp ${q.required ? '<span class="req">*</span>' : ''}</label>
        <input type="tel" id="inputWA" placeholder="08xxxxxxxxxx" value="${escapeAttr(vals.wa)}">
      </div>
    </div>`;
  }

  html += `<div id="errorSlot"></div>`;

  html += `<div class="nav">`;
  if(current > 0){
    html += `<button class="btn btn-ghost" id="btnBack">← Kembali</button>`;
  }
  const isLast = current === total - 1;
  html += `<button class="btn btn-primary" id="btnNext">${isLast ? "Kirim Jawaban →" : "Lanjut →"}</button>`;
  html += `</div>`;

  card.innerHTML = html;
  attachHandlers(q);
}

function escapeAttr(str){
  return String(str || "").replace(/"/g,"&quot;");
}

function attachHandlers(q){
  if(q.type === "single"){
    card.querySelectorAll(".option").forEach(el=>{
      el.addEventListener("click", ()=>{
        answers[q.id] = el.getAttribute("data-value");
        // update tampilan terpilih di tempat, tanpa render() ulang -> tidak ada efek berbayang
        card.querySelectorAll(".option").forEach(opt=>{
          opt.classList.toggle("selected", opt.getAttribute("data-value") === answers[q.id]);
        });
        setTimeout(goNext, 650); // jeda lebih lama sebelum lanjut, biar terasa & tidak buru-buru
      });
    });
  }

  if(q.type === "multi"){
    card.querySelectorAll(".option").forEach(el=>{
      el.addEventListener("click", ()=>{
        const val = el.getAttribute("data-value");
        let arr = answers[q.id] || [];
        if(arr.includes(val)){
          arr = arr.filter(v => v !== val);
        } else {
          if(arr.length >= q.max){
            showError(`Maksimal ${q.max} pilihan. Ketuk lagi salah satu pilihan untuk menggantinya.`);
            return;
          }
          arr = [...arr, val];
        }
        answers[q.id] = arr;
        // update tampilan terpilih di tempat, tanpa render() ulang -> tidak ada efek berbayang
        card.querySelectorAll(".option").forEach(opt=>{
          opt.classList.toggle("selected", arr.includes(opt.getAttribute("data-value")));
        });
        const hintEl = card.querySelector(".hint-max");
        if(hintEl) hintEl.textContent = `Maksimal ${q.max} pilihan`;
      });
    });
  }

  const backBtn = document.getElementById("btnBack");
  if(backBtn) backBtn.addEventListener("click", goBack);

  const nextBtn = document.getElementById("btnNext");
  if(nextBtn) nextBtn.addEventListener("click", ()=> {
    if(q.type === "contact"){
      const nama = document.getElementById("inputNama").value.trim();
      const wa = document.getElementById("inputWA").value.trim();
      answers[q.id] = { nama, wa };
    }
    goNext();
  });

  if(q.type === "contact"){
    const inputNama = document.getElementById("inputNama");
    const inputWA = document.getElementById("inputWA");
    [inputNama, inputWA].forEach(inp=>{
      inp.addEventListener("input", ()=>{
        answers[q.id] = {
          nama: inputNama.value.trim(),
          wa: inputWA.value.trim()
        };
      });
    });
  }
}

function showError(msg){
  const slot = document.getElementById("errorSlot");
  if(slot) slot.innerHTML = `<div class="error-msg">${msg}</div>`;
}

function validateCurrent(){
  const q = questions[current];
  if(q.type === "single" && !answers[q.id]){
    showError("Silakan pilih salah satu jawaban untuk melanjutkan.");
    return false;
  }
  if(q.type === "multi" && (!answers[q.id] || answers[q.id].length === 0)){
    showError("Silakan pilih minimal 1 jawaban untuk melanjutkan.");
    return false;
  }
  if(q.type === "contact" && q.required){
    const nama = document.getElementById("inputNama").value.trim();
    const wa = document.getElementById("inputWA").value.trim();
    if(!nama){
      showError("Nama wajib diisi untuk melanjutkan.");
      return false;
    }
    if(!wa){
      showError("Nomor WhatsApp wajib diisi untuk melanjutkan.");
      return false;
    }
    const waDigits = wa.replace(/[\s-]/g, "");
    if(!/^(\+?\d{9,15})$/.test(waDigits)){
      showError("Nomor WhatsApp tidak valid. Contoh: 081234567890");
      return false;
    }
    answers[q.id] = { nama, wa };
  }
  return true;
}

function goNext(){
  if(!validateCurrent()) return;
  if(current < total - 1){
    transitionTo(()=>{
      current++;
      render();
    });
  } else {
    transitionTo(()=> submitSurvey());
  }
}

function goBack(){
  if(current > 0){
    transitionTo(()=>{
      current--;
      render();
    });
  }
}

/* ============ TRANSISI ANTAR PERTANYAAN (fade-out lalu fade-in) ============ */
let isTransitioning = false;
function transitionTo(action){
  if(isTransitioning) return;
  isTransitioning = true;
  card.classList.add("card-exit");
  setTimeout(()=>{
    action();
    void card.offsetWidth; // paksa reflow supaya transisi fade-in kepakai
    card.classList.remove("card-exit");
    isTransitioning = false;
  }, 320);
}

/* ============ SUBMIT KE GOOGLE SHEETS ============ */
function submitSurvey(){
  const nextBtn = document.getElementById("btnNext");
  if(nextBtn){ nextBtn.disabled = true; nextBtn.textContent = "Mengirim..."; }

  const payload = {
    timestamp: new Date().toISOString(),
    tahu_bpr: answers.tahu_bpr || "",
    kebutuhan_finansial: answers.kebutuhan_finansial || "",
    produk_dibutuhkan: answers.produk_dibutuhkan || "",
    alasan_pilih_bpr: (answers.alasan_pilih_bpr || []).join(", "),
    kebutuhan_dana: answers.kebutuhan_dana || "",
    prioritas_produk_keuangan: answers.prioritas_produk_keuangan || "",
    minat_info_produk: answers.minat_info_produk || "",
    nama: (answers.identitas && answers.identitas.nama) || "",
    whatsapp: (answers.identitas && answers.identitas.wa) || ""
  };

  if(!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.indexOf("PASTE_URL") === 0){
    console.warn("GOOGLE_SHEET_WEBAPP_URL belum diatur. Data tidak terkirim ke Google Sheets:", payload);
    showThanks();
    return;
  }

  fetch(GOOGLE_SHEET_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(()=> showThanks())
  .catch((err)=>{
    console.error(err);
    if(nextBtn){ nextBtn.disabled = false; nextBtn.textContent = "Kirim Jawaban →"; }
    showError("Gagal mengirim jawaban. Periksa koneksi internet Anda dan coba lagi.");
  });
}

function showThanks(){
  progressFill.style.width = "100%";
  progressLabel.textContent = `Pertanyaan ${total} dari ${total}`;
  card.innerHTML = `
    <div class="thanks">
      <div class="seal-big">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5L9.5 18L20 6" stroke="#c9a227" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Terima Kasih!</h2>
      <p>Jawaban Anda telah berhasil kami terima. Kami sangat menghargai partisipasi Bapak/Ibu dalam survey ini.</p>
      <div class="brandline">🏦 BANK AKASIA MAS</div>
      <button class="btn-restart" id="btnRestart">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 15a8 8 0 1 0 1.5-9M18.5 9a8 8 0 0 0-1.5-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Isi Survey Lagi
      </button>
    </div>
  `;
  spawnConfetti();
  const restartBtn = document.getElementById("btnRestart");
  if(restartBtn) restartBtn.addEventListener("click", resetSurvey);
}

function spawnConfetti(){
  const colors = ["#c9a227", "#e0c568", "#8f2323", "#6e1717"];
  const seal = card.querySelector(".seal-big");
  if(!seal) return;
  for(let i=0; i<14; i++){
    const dot = document.createElement("div");
    dot.className = "confetti-dot";
    const size = 4 + Math.random()*5;
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.background = colors[i % colors.length];
    dot.style.left = (50 + (Math.random()*60 - 30)) + "%";
    dot.style.top = "0px";
    dot.style.animationDelay = (Math.random()*0.3) + "s";
    dot.style.animationDuration = (1.2 + Math.random()*0.8) + "s";
    seal.appendChild(dot);
  }
}

function resetSurvey(){
  current = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  render();
}

render();
</script>
