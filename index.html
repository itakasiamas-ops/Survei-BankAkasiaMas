<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#3d0d0d">
<title>Survey Kebutuhan Nasabah – Bank Akasia Mas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-950:#2a0707;
    --maroon-900:#4a0e0e;
    --maroon-800:#5c1414;
    --maroon-700:#6e1717;
    --maroon-500:#8f2323;
    --gold-600:#c98d00;
    --gold-500:#f0b400;
    --gold-300:#ffd35c;
    --gold-100:#fff1cf;
    --cream:#faf6ee;
    --cream-dim:#f2e9d8;
    --ink:#241b15;
    --ink-soft:#6b5f54;
    --line:#e6dcc9;
    --white:#ffffff;
    --radius:20px;
    --shadow: 0 24px 60px -22px rgba(30,6,6,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:
      radial-gradient(1000px 560px at 15% -10%, rgba(247,185,0,0.16), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(201,162,39,0.14), transparent 50%),
      linear-gradient(180deg, #fffaf0 0%, #fdf3d9 45%, #f9ecce 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: repeating-linear-gradient(135deg, rgba(94,20,20,0.025) 0px, rgba(94,20,20,0.025) 1px, transparent 1px, transparent 34px);
    pointer-events:none;
  }

  .header{
    width:100%;
    max-width:480px;
    padding:26px 20px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .logo-banner{
    width:auto;
    max-width:230px;
    height:auto;
    display:block;
    border-radius:7px;
    box-shadow:0 14px 30px -14px rgba(0,0,0,0.6);
  }
  .header-subtitle{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--maroon-700);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-subtitle::before, .header-subtitle::after{
    content:"";
    width:22px; height:1px;
    background:rgba(94,20,20,0.28);
  }

  .wrap{
    width:100%;
    max-width:480px;
    flex:1;
    display:flex;
    flex-direction:column;
    padding:6px 20px 40px;
    position:relative;
    z-index:1;
  }

  /* ============ PROGRESS DOT-STEPPER ============ */
  .progress-shell{
    margin:18px 0 22px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dots{
    flex:1;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    border-radius:99px;
    background:rgba(94,20,20,0.12);
    overflow:hidden;
    position:relative;
  }
  .dot::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-300));
    transform:scaleX(0);
    transform-origin:left;
    border-radius:99px;
    transition:transform .5s cubic-bezier(.65,0,.35,1);
  }
  .dot.done::after{ transform:scaleX(1); }
  .dot.current::after{ transform:scaleX(1); }
  .progress-count{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--maroon-700);
    white-space:nowrap;
    letter-spacing:0.02em;
  }
  .progress-count b{
    color:var(--maroon-950);
    font-weight:700;
  }

  .card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:0 24px 60px -22px rgba(94,20,20,0.22), 0 2px 8px -2px rgba(94,20,20,0.06);
    padding:34px 26px 26px;
    position:relative;
    overflow:hidden;
    flex:1;
    display:flex;
    flex-direction:column;
    transition:opacity .32s cubic-bezier(.4,0,.2,1), transform .32s cubic-bezier(.4,0,.2,1);
    border:1px solid rgba(94,20,20,0.06);
  }
  .card.card-exit{
    opacity:0;
    transform:translateY(-12px) scale(0.98);
  }
  /* aksen diagonal ala logo, pojok kanan-atas */
  .card::before{
    content:"";
    position:absolute;
    top:0; right:0;
    width:120px; height:120px;
    background:var(--maroon-800);
    clip-path:polygon(38% 0, 100% 0, 100% 62%);
    opacity:0.07;
  }
  .card::after{
    content:"";
    position:absolute;
    bottom:-70px; left:-70px;
    width:180px; height:180px;
    border-radius:50%;
    border:22px solid rgba(201,162,39,0.05);
  }

  .icon-badge{
    width:46px; height:46px;
    border-radius:13px;
    background:linear-gradient(155deg, var(--maroon-700), var(--maroon-950));
    display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
    box-shadow:0 8px 18px -8px rgba(74,14,14,0.55);
    position:relative;
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
  }
  .icon-badge::after{
    content:"";
    position:absolute; inset:-4px;
    border-radius:16px;
    border:1px solid rgba(201,162,39,0.35);
  }
  .icon-badge svg{
    width:22px; height:22px;
    stroke:var(--gold-300);
  }

  .step-num{
    font-family:'Fraunces', serif;
    font-size:12px;
    font-weight:700;
    color:var(--gold-600);
    letter-spacing:0.14em;
    margin-bottom:8px;
    text-transform:uppercase;
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
  }
  .q-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    line-height:1.28;
    color:var(--maroon-950);
    margin-bottom:6px;
    position:relative;
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
    animation-delay:.03s;
  }
  .q-subtitle{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:22px;
    font-style:italic;
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
    animation-delay:.06s;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:4px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:13px;
    padding:15px 16px;
    border:1.5px solid var(--line);
    border-radius:13px;
    background:var(--cream);
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease, box-shadow .18s ease;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    position:relative;
    animation: optionIn .38s cubic-bezier(.22,1,.36,1) both;
  }
  .option::before{
    content:"";
    position:absolute;
    left:0; top:8px; bottom:8px;
    width:3px;
    border-radius:0 3px 3px 0;
    background:var(--gold-500);
    transform:scaleY(0);
    transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .option.selected::before{ transform:scaleY(1); }
  .option:hover{
    border-color:var(--gold-500);
    transform:translateX(2px);
    box-shadow:0 8px 18px -10px rgba(74,14,14,0.28);
  }
  .option .mark{
    width:20px; height:20px;
    border:1.5px solid #c9bda8;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
    background:var(--white);
  }
  .option .mark.round{ border-radius:50%; }
  .option .mark.square{ border-radius:6px; }
  .option .mark::after{
    content:"";
    width:9px; height:9px;
    border-radius:50%;
    background:var(--gold-500);
    opacity:0;
    transform:scale(0);
  }
  .option .mark.square::after{ border-radius:2px; }
  .option.selected{
    border-color:var(--maroon-700);
    background:linear-gradient(180deg, #fdf8ee, #fbf3e0);
    animation: optionPop .32s cubic-bezier(.34,1.56,.64,1);
  }
  .option.selected .mark{ border-color:var(--maroon-700); }
  .option.selected .mark::after{
    animation: markPop .28s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes optionPop{
    0%{ transform:scale(1); } 35%{ transform:scale(1.015); } 100%{ transform:scale(1); }
  }
  @keyframes markPop{
    0%{ transform:scale(0); opacity:0; } 60%{ transform:scale(1.3); opacity:1; } 100%{ transform:scale(1); opacity:1; }
  }
  @keyframes optionIn{
    from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:translateX(0); }
  }

  .hint-max{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 12px;
    border-radius:11px;
    background:transparent;
    transition:background .25s ease, color .25s ease;
  }
  .hint-max svg{ width:13px; height:13px; stroke:var(--gold-600); flex-shrink:0; }
  /* pengingat lembut: 1 dari maks dipilih — bukan error, sekadar ajakan */
  .hint-max.state-partial{
    background:rgba(240,180,0,0.13);
    color:var(--maroon-800);
    font-weight:600;
    animation: hintPulse .5s ease;
  }
  .hint-max.state-partial svg{ stroke:var(--maroon-700); }
  @keyframes hintPulse{
    0%{ transform:scale(0.98); } 50%{ transform:scale(1.015); } 100%{ transform:scale(1); }
  }
  /* sudah lengkap 2/2 */
  .hint-max.state-full{
    background:rgba(46,139,87,0.08);
    color:var(--maroon-800);
  }
  .hint-max.state-full svg{ stroke:#2e8b57; }

  .fields{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:4px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--maroon-900);
    margin-bottom:7px;
  }
  .field label .req{ color:var(--maroon-500); }
  .field input{
    width:100%;
    padding:14px 15px;
    border:1.5px solid var(--line);
    border-radius:11px;
    font-family:inherit;
    font-size:14.5px;
    background:var(--cream);
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{
    outline:none;
    border-color:var(--maroon-700);
    box-shadow:0 0 0 3px rgba(110,23,23,0.1);
  }

  .nav{
    margin-top:auto;
    padding-top:26px;
    display:flex;
    gap:10px;
    animation: fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both;
    animation-delay:.1s;
  }
  .btn{
    flex:1;
    padding:16px 18px;
    border-radius:13px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease, box-shadow .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(0.98); }
  .btn svg{ width:16px; height:16px; }
  .btn-primary{
    background:linear-gradient(180deg, var(--maroon-700), var(--maroon-950));
    color:var(--gold-100);
    box-shadow:0 12px 26px -12px rgba(74,14,14,0.65);
    position:relative;
    overflow:hidden;
  }
  .btn-primary::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
    transform:translateX(-100%);
  }
  .btn-primary:not(:disabled):hover::after{ animation: shine 1.1s ease; }
  @keyframes shine{ to{ transform:translateX(100%); } }
  .btn-primary:not(:disabled):hover{
    box-shadow:0 14px 30px -12px rgba(74,14,14,0.8);
    transform:translateY(-1px);
  }
  .btn-primary:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{
    flex:0 0 auto;
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    padding:16px 18px;
  }
  .btn-ghost:hover{ border-color:var(--maroon-700); color:var(--maroon-700); }

  .footer-note{
    text-align:center;
    color:rgba(74,14,14,0.45);
    font-size:11px;
    margin-top:20px;
    letter-spacing:0.03em;
  }

  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); }
  }

  .error-msg{
    background:#fdeceb;
    border:1px solid #f3b9b3;
    color:#8a2b22;
    font-size:12.5px;
    padding:11px 13px;
    border-radius:11px;
    margin-top:14px;
    display:flex; align-items:flex-start; gap:8px;
  }
  .error-msg svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; }

  /* ============ Thank you screen ============ */
  .thanks{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    justify-content:center;
    flex:1;
    padding:16px 6px;
    animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(0.985); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .thanks .seal-big{
    width:78px; height:78px;
    border-radius:50%;
    background:linear-gradient(155deg, var(--maroon-700), var(--maroon-950));
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    position:relative;
    animation: sealBigIn .6s cubic-bezier(.34,1.56,.64,1) both;
    box-shadow:0 14px 30px -12px rgba(74,14,14,0.6);
  }
  .thanks .seal-big::after{
    content:"";
    position:absolute; inset:-9px;
    border:1px solid rgba(201,162,39,0.4);
    border-radius:50%;
  }
  @keyframes sealBigIn{ 0%{ opacity:0; transform:scale(0.5) rotate(-15deg); } 100%{ opacity:1; transform:scale(1) rotate(0deg); } }
  .thanks .seal-big svg{ width:32px; height:32px; }
  .thanks .seal-big svg path{
    stroke-dasharray:30; stroke-dashoffset:30;
    animation: drawCheck .5s ease .35s forwards;
  }
  @keyframes drawCheck{ to{ stroke-dashoffset:0; } }
  .thanks h2{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    color:var(--maroon-950);
    margin-bottom:10px;
    animation: fadeSlideUp .45s ease .2s both;
  }
  .thanks p{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.6;
    max-width:320px;
    animation: fadeSlideUp .45s ease .3s both;
  }
  .thanks .brandline{
    margin-top:26px;
    font-size:12px;
    color:var(--gold-600);
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    animation: fadeSlideUp .45s ease .4s both;
  }
  .thanks .btn-restart{
    animation: fadeSlideUp .45s ease .5s both;
    margin-top:24px;
    background:transparent;
    border:1.5px solid var(--maroon-700);
    color:var(--maroon-900);
    padding:14px 26px;
    border-radius:13px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:all .18s ease;
  }
  .thanks .btn-restart:hover{
    background:var(--maroon-900);
    color:var(--gold-300);
    transform:translateY(-1px);
    box-shadow:0 10px 22px -12px rgba(74,14,14,0.6);
  }
  .thanks .btn-restart svg{ width:15px; height:15px; transition:transform .3s ease; }
  .thanks .btn-restart:hover svg{ transform:rotate(180deg); }

  /* ============ Layar Mengirim (loading) ============ */
  .sending{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    justify-content:center;
    flex:1;
    padding:16px 6px;
    animation: cardIn .4s cubic-bezier(.22,1,.36,1) both;
  }
  .sending .spinner{
    width:52px; height:52px;
    border-radius:50%;
    border:4px solid rgba(94,20,20,0.12);
    border-top-color: var(--maroon-700);
    margin-bottom:22px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .sending h2{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:600;
    color:var(--maroon-950);
    margin-bottom:8px;
    animation: fadeSlideUp .4s ease .1s both;
  }
  .sending p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    max-width:280px;
    animation: fadeSlideUp .4s ease .18s both;
  }
  .sending.sending-error .spinner{ display:none; }
  .sending.sending-error .error-icon{
    width:52px; height:52px;
    border-radius:50%;
    background:#fdeceb;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    animation: sealBigIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .sending.sending-error .error-icon svg{ width:24px; height:24px; }
  .sending .btn-retry{
    margin-top:24px;
    background:linear-gradient(180deg, var(--maroon-700), var(--maroon-950));
    color:var(--gold-100);
    border:none;
    padding:14px 26px;
    border-radius:13px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    box-shadow:0 12px 26px -12px rgba(74,14,14,0.65);
    transition:transform .1s ease;
    animation: fadeSlideUp .4s ease .26s both;
  }
  .sending .btn-retry:active{ transform:scale(0.98); }
  .sending .btn-retry svg{ width:15px; height:15px; }

  .confetti-dot{
    position:absolute;
    border-radius:50%;
    opacity:0;
    animation: confettiFall 1.6s ease-out forwards;
  }
  @keyframes confettiFall{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(70px) scale(0.4); }
  }

  .hidden{ display:none !important; }

  @media (max-width: 400px){
    .card{ padding:28px 20px 20px; }
    .q-title{ font-size:21px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="header">
  <img src="assets/logo-bank-akasia-mas.png" alt="Bank Akasia Mas" class="logo-banner">
  <div class="header-subtitle">Survey Kebutuhan Nasabah</div>
</div>

<div class="wrap">

  <div class="progress-shell">
    <div class="dots" id="dots"></div>
    <div class="progress-count" id="progressCount"></div>
  </div>

  <div class="card" id="card">
    <!-- question content injected here -->
  </div>

  <div class="footer-note">Bank Akasia Mas · Data Anda aman bersama kami 🔒</div>
</div>

<script>
/* =========================================================
   KONFIGURASI — ganti URL ini dengan Web App URL Apps Script-mu
   ========================================================= */
const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzaIQQVg5q0WIqTlfrtuhSuaZ1WP_El0tPEBhFCm_eoOrFR2cWb-z0RlAKCo3bBOBwU/exec";

/* ============ IKON (inline SVG, satu set konsisten) ============ */
const ICONS = {
  user: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>`,
  bank: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-5.5L21 10"/><path d="M4.5 10.5v8M9 10.5v8M15 10.5v8M19.5 10.5v8"/><path d="M3 20h18"/></svg>`,

/* ============ STATE ============ */
let current = 0;
const answers = {};
const total = questions.length;

const card = document.getElementById("card");
const dotsEl = document.getElementById("dots");
const progressCount = document.getElementById("progressCount");

function buildDots(){
  dotsEl.innerHTML = questions.map((_,i)=>`<div class="dot" data-i="${i}"></div>`).join("");
}
buildDots();

function updateProgress(){
  progressCount.innerHTML = `<b>${current+1}</b>/${total}`;
  dotsEl.querySelectorAll(".dot").forEach((d,i)=>{
    d.classList.toggle("done", i < current);
    d.classList.toggle("current", i === current);
  });
}

function render(){
  updateProgress();
  const q = questions[current];
  let html = `<div class="icon-badge">${ICONS[q.icon] || ICONS.info}</div>`;
  html += `<div class="step-num">Pertanyaan ${String(current+1).padStart(2,"0")} dari ${String(total).padStart(2,"0")}</div>`;
  html += `<div class="q-title">${q.title}</div>`;
  if(q.subtitle) html += `<div class="q-subtitle">${q.subtitle}</div>`;

  if(q.type === "single"){
    html += `<div class="options">`;
    q.options.forEach((opt,i)=>{
      const selected = answers[q.id] === opt ? "selected" : "";
      html += `<div class="option ${selected}" data-value="${escapeAttr(opt)}" style="animation-delay:${i*0.045}s">
                 <span class="mark round"></span>${opt}
               </div>`;
    });
    html += `</div>`;
  }

  if(q.type === "multi"){
    html += `<div class="options">`;
    q.options.forEach((opt,i)=>{
      const arr = answers[q.id] || [];
      const selected = arr.includes(opt) ? "selected" : "";
      html += `<div class="option ${selected}" data-value="${escapeAttr(opt)}" style="animation-delay:${i*0.045}s">
                 <span class="mark square"></span>${opt}
               </div>`;
    });
    html += `<div id="hintMaxSlot">${multiHintHTML((answers[q.id]||[]).length, q.max)}</div>`;
  }

  if(q.type === "contact"){
    const vals = answers[q.id] || {nama:"", wa:""};
    html += `<div class="fields">
      <div class="field">
        <label>Nama ${q.required ? '<span class="req">*</span>' : ''}</label>
        <input type="text" id="inputNama" placeholder="Nama lengkap" value="${escapeAttr(vals.nama)}">
      </div>
      <div class="field">
        <label>Nomor WhatsApp ${q.required ? '<span class="req">*</span>' : ''}</label>
        <input type="tel" id="inputWA" placeholder="08xxxxxxxxxx" value="${escapeAttr(vals.wa)}">
      </div>
    </div>`;
  }

  html += `<div id="errorSlot"></div>`;

  html += `<div class="nav">`;
  if(current > 0){
    html += `<button class="btn btn-ghost" id="btnBack">${ICONS.back}</button>`;
  }
  const isLast = current === total - 1;
  html += `<button class="btn btn-primary" id="btnNext">${isLast ? "Kirim Jawaban" : "Lanjut"}${ICONS.arrow}</button>`;
  html += `</div>`;

  card.innerHTML = html;
  attachHandlers(q);
}

/* Indikator jumlah pilihan dinamis untuk pertanyaan multi-pilih.
   Ini bukan validasi wajib — hanya pengingat lembut. "Maksimal 2"
   tetap berarti nasabah boleh lanjut walau baru pilih 1. */
function multiHintHTML(count, max){
  if(count >= max){
    return `<div class="hint-max state-full">${ICONS.check}<span>${count}/${max} dipilih — alasan Anda sudah lengkap</span></div>`;
  }
  if(count === 1){
    return `<div class="hint-max state-partial">${ICONS.info}<span>${count}/${max} dipilih — boleh tambah 1 alasan lagi kalau relevan (opsional)</span></div>`;
  }
  return `<div class="hint-max">${ICONS.info}<span>Pilih hingga ${max} alasan yang paling sesuai dengan Anda</span></div>`;
}

function escapeAttr(str){
  return String(str || "").replace(/"/g,"&quot;");
}

function attachHandlers(q){
  if(q.type === "single"){
    card.querySelectorAll(".option").forEach(el=>{
      el.addEventListener("click", ()=>{
        answers[q.id] = el.getAttribute("data-value");
        card.querySelectorAll(".option").forEach(opt=>{
          opt.classList.toggle("selected", opt.getAttribute("data-value") === answers[q.id]);
        });
        setTimeout(goNext, 650);
      });
    });
  }

  if(q.type === "multi"){
    card.querySelectorAll(".option").forEach(el=>{
      el.addEventListener("click", ()=>{
        const val = el.getAttribute("data-value");
        let arr = answers[q.id] || [];
        if(arr.includes(val)){
          arr = arr.filter(v => v !== val);
        } else {
          if(arr.length >= q.max){
            showError(`Maksimal ${q.max} pilihan. Ketuk lagi salah satu pilihan untuk menggantinya.`);
            return;
          }
          arr = [...arr, val];
        }
        answers[q.id] = arr;
        card.querySelectorAll(".option").forEach(opt=>{
          opt.classList.toggle("selected", arr.includes(opt.getAttribute("data-value")));
        });
        const hintSlot = document.getElementById("hintMaxSlot");
        if(hintSlot) hintSlot.innerHTML = multiHintHTML(arr.length, q.max);
      });
    });
  }

  const backBtn = document.getElementById("btnBack");
  if(backBtn) backBtn.addEventListener("click", goBack);

  const nextBtn = document.getElementById("btnNext");
  if(nextBtn) nextBtn.addEventListener("click", ()=> {
    if(q.type === "contact"){
      const nama = document.getElementById("inputNama").value.trim();
      const wa = document.getElementById("inputWA").value.trim();
      answers[q.id] = { nama, wa };
    }
    goNext();
  });

  if(q.type === "contact"){
    const inputNama = document.getElementById("inputNama");
    const inputWA = document.getElementById("inputWA");
    [inputNama, inputWA].forEach(inp=>{
      inp.addEventListener("input", ()=>{
        answers[q.id] = { nama: inputNama.value.trim(), wa: inputWA.value.trim() };
      });
    });
  }
}

function showError(msg){
  const slot = document.getElementById("errorSlot");
  if(slot) slot.innerHTML = `<div class="error-msg">${ICONS.warn}<span>${msg}</span></div>`;
}

function validateCurrent(){
  const q = questions[current];
  if(q.type === "single" && !answers[q.id]){
    showError("Silakan pilih salah satu jawaban untuk melanjutkan.");
    return false;
  }
  if(q.type === "multi" && (!answers[q.id] || answers[q.id].length === 0)){
    showError("Silakan pilih minimal 1 jawaban untuk melanjutkan.");
    return false;
  }
  if(q.type === "contact" && q.required){
    const nama = document.getElementById("inputNama").value.trim();
    const wa = document.getElementById("inputWA").value.trim();
    if(!nama){ showError("Nama wajib diisi untuk melanjutkan."); return false; }
    if(!wa){ showError("Nomor WhatsApp wajib diisi untuk melanjutkan."); return false; }
    const waDigits = wa.replace(/[\s-]/g, "");
    if(!/^(\+?\d{9,15})$/.test(waDigits)){
      showError("Nomor WhatsApp tidak valid. Contoh: 081234567890");
      return false;
    }
    answers[q.id] = { nama, wa };
  }
  return true;
}

function goNext(){
  if(!validateCurrent()) return;
  if(current < total - 1){
    transitionTo(()=>{ current++; render(); });
  } else {
    transitionTo(()=> showSending());
  }
}

function goBack(){
  if(current > 0){
    transitionTo(()=>{ current--; render(); });
  }
}

let isTransitioning = false;
function transitionTo(action){
  if(isTransitioning) return;
  isTransitioning = true;
  card.classList.add("card-exit");
  setTimeout(()=>{
    action();
    void card.offsetWidth;
    card.classList.remove("card-exit");
    isTransitioning = false;
  }, 320);
}

/* ============ LAYAR "MENGIRIM..." + SUBMIT KE GOOGLE SHEETS ============ */

// Ganti isi card jadi layar loading yang jelas (spinner + teks),
// bukan sekadar fade card kosong yang bikin bingung/terlihat "berbayang".
function showSending(){
  card.innerHTML = `
    <div class="sending">
      <div class="spinner"></div>
      <h2>Mengirim jawaban...</h2>
      <p>Mohon tunggu sebentar, jangan tutup atau refresh halaman ini.</p>
    </div>
  `;
  doSubmit();
}

function doSubmit(){
  const payload = {
    timestamp: new Date().toISOString(),
    tahu_bpr: answers.tahu_bpr || "",
    kebutuhan_finansial: answers.kebutuhan_finansial || "",
    produk_dibutuhkan: answers.produk_dibutuhkan || "",
    alasan_pilih_bpr: (answers.alasan_pilih_bpr || []).join(", "),
    kebutuhan_dana: answers.kebutuhan_dana || "",
    prioritas_produk_keuangan: answers.prioritas_produk_keuangan || "",
    minat_info_produk: answers.minat_info_produk || "",
    nama: (answers.identitas && answers.identitas.nama) || "",
    whatsapp: (answers.identitas && answers.identitas.wa) || ""
  };

  if(!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.indexOf("https://script.google.com/macros/s/AKfycbzaIQQVg5q0WIqTlfrtuhSuaZ1WP_El0tPEBhFCm_eoOrFR2cWb-z0RlAKCo3bBOBwU/exec") === 0){
    console.warn("GOOGLE_SHEET_WEBAPP_URL belum diatur. Data tidak terkirim ke Google Sheets:", payload);
    showThanks();
    return;
  }

  fetch(GOOGLE_SHEET_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(()=> showThanks())
  .catch((err)=>{
    console.error(err);
    showSendError();
  });
}

// Layar error kirim, dengan tombol coba lagi yang jelas
// (menggantikan pesan error kecil di bawah tombol yang dulunya
// tidak relevan lagi karena card sudah tidak menampilkan opsi).
function showSendError(){
  card.innerHTML = `
    <div class="sending sending-error">
      <div class="error-icon">${ICONS.warn}</div>
      <h2>Gagal Mengirim</h2>
      <p>Periksa koneksi internet Anda, lalu coba lagi. Jawaban Anda masih tersimpan.</p>
      <button class="btn-retry" id="btnRetry">${ICONS.refresh}Coba Lagi</button>
    </div>
  `;
  const retryBtn = document.getElementById("btnRetry");
  if(retryBtn) retryBtn.addEventListener("click", showSending);
}

function showThanks(){
  progressCount.innerHTML = `<b>${total}</b>/${total}`;
  dotsEl.querySelectorAll(".dot").forEach(d=> d.classList.add("done"));
  card.innerHTML = `
    <div class="thanks">
      <div class="seal-big">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5L9.5 18L20 6" stroke="#e0c568" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Terima Kasih!</h2>
      <p>Jawaban Anda telah berhasil kami terima. Kami sangat menghargai partisipasi Bapak/Ibu dalam survey ini.</p>
      <div class="brandline">Bank Akasia Mas</div>
      <button class="btn-restart" id="btnRestart">${ICONS.refresh}Isi Survey Lagi</button>
    </div>
  `;
  spawnConfetti();
  const restartBtn = document.getElementById("btnRestart");
  if(restartBtn) restartBtn.addEventListener("click", resetSurvey);
}

function spawnConfetti(){
  const colors = ["#c9a227", "#e0c568", "#8f2323", "#6e1717"];
  const seal = card.querySelector(".seal-big");
  if(!seal) return;
  for(let i=0; i<14; i++){
    const dot = document.createElement("div");
    dot.className = "confetti-dot";
    const size = 4 + Math.random()*5;
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.background = colors[i % colors.length];
    dot.style.left = (50 + (Math.random()*60 - 30)) + "%";
    dot.style.top = "0px";
    dot.style.animationDelay = (Math.random()*0.3) + "s";
    dot.style.animationDuration = (1.2 + Math.random()*0.8) + "s";
    seal.appendChild(dot);
  }
}

function resetSurvey(){
  current = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  render();
}

render();
</script>
